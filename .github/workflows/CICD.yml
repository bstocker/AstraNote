name: Deploy to PythonAnywhere (recursive upload)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deux déploiements simultanés se partagent le quota de l'API PythonAnywhere et
# échouent tous les deux : on les met en file plutôt qu'en concurrence.
concurrency:
  group: deploy-pythonanywhere
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test          # le déploiement n'a lieu que si les tests passent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${{ secrets.PA_USERNAME }}"
          : "${{ secrets.PA_TOKEN }}"
          : "${{ secrets.PA_TARGET_DIR }}"
          : "${{ secrets.PA_WEBAPP_DOMAIN }}"

      - name: Upload all files recursively (dirs auto-created by Files API)
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.PA_USERNAME }}"
          TOKEN="${{ secrets.PA_TOKEN }}"
          TARGET_DIR="${{ secrets.PA_TARGET_DIR }}"
          DOMAIN="${{ secrets.PA_WEBAPP_DOMAIN }}"

          # Optional: set PA_HOST secret to "eu.pythonanywhere.com" if your account is on EU.
          HOST="${{ secrets.PA_HOST }}"
          if [[ -z "${HOST}" ]]; then HOST="www.pythonanywhere.com"; fi

          echo "Using PythonAnywhere host: ${HOST}"
          echo "Target directory: ${TARGET_DIR}"

          # L'API PythonAnywhere plafonne à 40 requêtes par minute. Le dépôt
          # compte une quarantaine de fichiers : envoyés à pleine vitesse, les
          # derniers se font refuser (HTTP 429), l'upload s'arrête au milieu et
          # la webapp n'est jamais rechargée — elle continue alors de servir
          # l'ancien code. D'où ce rythme volontairement lent et ces réessais.
          api_call() {  # api_call <description> <arguments curl...>
            local what="$1"; shift
            local wait=5 code attempt
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$@" || echo 000)
              case "${code}" in 2*) return 0 ;; esac
              echo "   ${what} : HTTP ${code} (tentative ${attempt}/6), attente ${wait}s"
              sleep "${wait}"
              if (( wait < 60 )); then wait=$(( wait * 2 )); fi
            done
            echo "::error::${what} : échec après 6 tentatives (HTTP ${code})"
            return 1
          }

          # Upload every file; remote directories are created automatically by the Files API.
          while IFS= read -r -d '' file; do
            rel="${file#./}"

            # Exclusions (adjust to taste)
            # IMPORTANT : on n'uploade jamais la base SQLite ni le dossier
            # instance/ pour ne pas écraser les données de production.
            case "$rel" in
              .git/*|.github/*|.venv/*|__pycache__/*|node_modules/*) continue ;;
              instance/*) continue ;;
              *.pyc|.DS_Store|*.db|*.sqlite|*.sqlite3) continue ;;
            esac

            remote_path="${TARGET_DIR}/${rel}"
            echo " - ${rel} -> ${remote_path}"

            api_call "${rel}" -X POST \
              -H "Authorization: Token ${TOKEN}" \
              -F "content=@${file}" \
              "https://${HOST}/api/v0/user/${USER}/files/path${remote_path}"

            # ~1,6 s entre deux fichiers : sous la barre des 40 appels/minute.
            sleep 1.6

          done < <(
            find . \
              -type d \( -name .git -o -name .github -o -name .venv -o -name __pycache__ -o -name node_modules -o -name instance \) -prune -false \
              -o -type f \
                ! -name ".DS_Store" \
                ! -name "*.pyc" \
                ! -name "*.db" \
                ! -name "*.sqlite" \
                ! -name "*.sqlite3" \
                -print0
          )

          echo "Reloading webapp ${DOMAIN}..."
          api_call "rechargement de ${DOMAIN}" -X POST \
            -H "Authorization: Token ${TOKEN}" \
            "https://${HOST}/api/v0/user/${USER}/webapps/${DOMAIN}/reload/"

          echo "Deployed. Try: https://${DOMAIN}/"
